# Nginx — Sistema de Gestión de Soporte
# Copiar a /etc/nginx/sites-available/sistema-soporte
# Enlazar: ln -s .../sistema-soporte /etc/nginx/sites-enabled/
# Reemplazar DOMAIN antes de certbot

upstream sistema_soporte_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/sistema-soporte;
    index index.html;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://sistema_soporte_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://sistema_soporte_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
